<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Upload Panel</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <img src="images/logo.png" class="logo">

        <h2>Dashboard</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="upload.html">Upload Files</a>
        <a href="downloads.html">Downloads</a>
        <a href="about.html">About Us</a>
        <a href="mission.html">Mission</a>
        <a href="vision.html">Vision</a>
        <a href="objectives.html">Objectives</a>
        <a href="core-values.html">Core Values</a>
        <a href="contact.html">Contact</a>
        <a href="support.html">Support</a>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <div class="center-box">

            <h1 style="text-align:center;color:green;">
                Admin Upload Panel
            </h1>

            <p style="text-align:center;">
                Upload Images, Audio, Videos, PDF, ZIP and Documents
            </p>

            <input
                type="file"
                id="file"
                accept="image/*,video/*,audio/*,.pdf,.zip,.doc,.docx"
            >

            <br><br>

            <button onclick="uploadFile()">
                Upload File
            </button>

            <br><br>

            <div id="status"></div>

        </div>

    </div>

</div>

<script>

const API_URL =
'https://kuyo-and-rescue-team-organisation.onrender.com';

function logout(){

    localStorage.removeItem('token');
    localStorage.removeItem('role');

    window.location.href='login.html';

}

async function uploadFile(){

    const token =
    localStorage.getItem('token');

    if(!token){

        alert('Please login first');

        window.location.href='login.html';

        return;
    }

    const fileInput =
    document.getElementById('file');

    if(fileInput.files.length === 0){

        alert('Please select a file');

        return;
    }

    const formData =
    new FormData();

    formData.append(
        'file',
        fileInput.files[0]
    );

    document.getElementById('status').innerHTML =
    '<p style="color:orange;text-align:center;">Uploading...</p>';

    try{

        const response =
        await fetch(
            `${API_URL}/api/upload`,
            {
                method:'POST',
                headers:{
                    Authorization:'Bearer ' + token
                },
                body:formData
            }
        );

        const data =
        await response.json();

        if(response.ok){

            document.getElementById('status').innerHTML =
            `
            <p style="color:green;text-align:center;">
                ${data.message}
            </p>

            <p style="text-align:center;">
                <a href="${data.url}" target="_blank">
                    View Uploaded File
                </a>
            </p>
            `;

        }else{

            document.getElementById('status').innerHTML =
            `
            <p style="color:red;text-align:center;">
                ${data.message}
            </p>
            `;
        }

    }catch(error){

        document.getElementById('status').innerHTML =
        `
        <p style="color:red;text-align:center;">
            Upload failed. Check Render logs.
        </p>
        `;
    }

}

</script>

</body>
</html>
