<!DOCTYPE html>
<html>
<head>
  <title>KUYO & RESCUE TEAM Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>KUYO & RESCUE TEAM</h1>
  <p>Emergency Rescue & Humanitarian Support System</p>
</header>

<div class="dashboard">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>Menu</h2>

<a href="/dashboard">Dashboard</a>

<hr>

<h3>Organization</h3>
<a href="/about">About Us</a>
<a href="/mission">Mission</a>
<a href="/vision">Vision</a>
<a href="/objectives">Objectives</a>
<a href="/core-values">Core Values</a>

<hr>

<h3>Support</h3>
<a href="/contact">Contact</a>
<a href="/support">Support</a>
<a href="/downloads">Downloads</a>

<hr>

<h3>Account</h3>
<a href="/login">Login</a>
<a href="/signup">Sign Up</a>

<button onclick="logout()">Logout</button>

</div>

<!-- MAIN CONTENT -->
<div class="main-content">

<h1>Dashboard</h1>

<p id="userInfo">Loading user...</p>

<!-- ADMIN ONLY -->
<div id="adminBox" style="display:none; margin-top:20px; padding:10px; border:1px solid #ccc;">
  <h3>🔐 Admin Upload Panel</h3>

  <form id="uploadForm">
    <input type="file" id="file" required />
    <button type="submit">Upload File</button>
  </form>

  <p id="uploadMsg"></p>
</div>

</div>

</div>

<script>
const token = localStorage.getItem('token');

if (!token) {
  window.location.href = '/login';
}

// ---------------- PROFILE ----------------
async function loadUser() {
  try {
    const res = await fetch('/api/profile', {
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      localStorage.removeItem('token');
      window.location.href = '/login';
      return;
    }

    document.getElementById('userInfo').innerText =
      `Logged in as: ${data.email} | Role: ${data.role || 'user'}`;

    // SHOW ADMIN PANEL
    if (data.role === 'admin') {
      document.getElementById('adminBox').style.display = 'block';
    }

  } catch (err) {
    console.error(err);
    window.location.href = '/login';
  }
}

loadUser();

// ---------------- UPLOAD (ADMIN ONLY) ----------------
document.getElementById('uploadForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();

  const file = document.getElementById('file').files[0];

  const formData = new FormData();
  formData.append('file', file);

  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token
    },
    body: formData
  });

  const data = await res.json();

  document.getElementById('uploadMsg').innerText =
    data.message || data.error;
});

// ---------------- LOGOUT ----------------
function logout() {
  localStorage.removeItem('token');
  window.location.href = '/login';
}
</script>

</body>
</html>
